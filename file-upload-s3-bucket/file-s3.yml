apiVersion: v1
kind: Namespace
metadata:
    name: s3file
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: s3file-dep
    namespace: s3file
spec:
  replicas: 2
  strategy:
      type: RollingUpdate
      rollingUpdate:
         maxUnavailable: 25%
         maxSurge: 25%
  selector:
    matchLabels:
           app: s3fileDeployment
  template:
    metadata:
       name: s3fileDeployment
       labels:
         app: s3fileDeployment
    spec:
     containers:
      - name: s3file-containers
        image: iamnew2dockerhub/file-upload-s3-bucket
        ports:
        - containerPort: 8080
        resources:
         requests:
             cpu: "1m"
             memory: "500Mi"
         limits:
             cpu: "1m"
             memory: "800Mi"
---
apiVersion: v1
kind: Service
metadata:
   name: s3file-svc
   namespace: s3file
spec:
  type: NodePort
  selector:
       app: s3fileDeployment 
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30008
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: s3file-hpa
    namespace: s3file
spec:
  scaleTargetRef:
     apiVersion: apps/v1
     kind: Deployment
     name: s3file-dep
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
     name: cpu
     target:
      type: Utilization
      averageUtilization: 40
  - type: Resource
    resource:
     name: memory
     target:
      type: Utilization
      averageUtilization: 40